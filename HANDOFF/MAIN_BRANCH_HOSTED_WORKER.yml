# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch. This file must be
# identical on `main` (where it actually fires) and on the application branch. It checks out
# PROCESSING_BRANCH so the worker image always matches the intended application source.
  actions: read   # lets the image-readiness gate inspect the image build run
    timeout-minutes: 55
      IMAGE_WAIT_SECONDS: "1500"
          if [ -z "$WORKER_TOKEN" ]; then
      - name: Check out the processing source
          ref: ${{ env.PROCESSING_BRANCH }}
      - name: Resolve immutable worker image for this exact commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omniintel-cloud-worker:sha-$sha" >> "$GITHUB_OUTPUT"
      # The worker must never start before the image for this exact commit exists.
      # Publishing runs in a separate workflow, so wait for it instead of racing it.
      - name: Wait until the exact image has been published
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SHA: ${{ steps.image.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          deadline=$(( $(date +%s) + IMAGE_WAIT_SECONDS ))
          missing_since=$(date +%s)
          while :; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "Image is published: $IMAGE"
              exit 0
            fi
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-worker-image.yml \
              --commit "$SHA" --json status,conclusion,url --limit 5 2>/dev/null || echo '[]')"
            if echo "$runs" | grep -q '"conclusion":"success"'; then
              echo "Build reported success; waiting for registry propagation..."
            elif echo "$runs" | grep -Eq '"status":"(queued|in_progress|waiting|pending)"'; then
              echo "Image build for $SHA is still running; waiting..."
              missing_since=$(date +%s)
            elif echo "$runs" | grep -Eq '"conclusion":"(failure|cancelled|timed_out)"'; then
              echo "::error::The image build for commit $SHA failed. Fix publish-worker-image.yml first: $runs"
              exit 1
            elif [ $(( $(date +%s) - missing_since )) -gt 180 ]; then
              echo "::error::No image build exists for commit $SHA. Run 'Cloud worker image' on ${PROCESSING_BRANCH}."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${IMAGE_WAIT_SECONDS}s waiting for $IMAGE"
              exit 1
            fi
            sleep 30
          done

      - name: Process queued jobs (stops claiming new jobs after 10 minutes)
        timeout-minutes: 50
          IMAGE: ${{ steps.image.outputs.ref }}
          mkdir -p "$RUNNER_TEMP/omniintel/huggingface" "$RUNNER_TEMP/omniintel/cache"
            "$IMAGE" --poll-seconds 5 --max-seconds 600
