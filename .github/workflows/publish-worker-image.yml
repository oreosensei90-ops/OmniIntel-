name: Cloud worker image

on:
  push:
    branches: [main, "milestone/**", "fix/**"]
    paths:
      - "Dockerfile.cloud-worker"
      - ".dockerignore"
      - "pyproject.toml"
      - "engine/**"
      - "deploy/start-cloud-worker.sh"
      - ".github/workflows/publish-worker-image.yml"
  pull_request:
    branches: [main, "milestone/**"]
    paths:
      - "Dockerfile.cloud-worker"
      - ".dockerignore"
      - "pyproject.toml"
      - "engine/**"
      - "deploy/start-cloud-worker.sh"
      - ".github/workflows/publish-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/omniintel-cloud-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
