name: Cloudflare Worker Bridge
on:
  push:
    branches: [build/d1-b2-worker-bridge]
    paths:
      - "infra/cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    paths:
      - "infra/cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
