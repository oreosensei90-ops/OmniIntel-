name: OmniIntel Hosted Cloud Worker

on:
  # Check for queued work twice an hour. A run claims at most one job and exits.
  # This is a bounded, best-effort runner, not an always-on server.
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - "build/d1-b2-worker-bridge"
    paths:
      - "engine/**"
      - "pyproject.toml"
      - ".github/workflows/hosted-cloud-worker.yml"
  pull_request:
    paths:
      - "engine/**"
      - "pyproject.toml"
      - ".github/workflows/hosted-cloud-worker.yml"

permissions:
  contents: read

concurrency:
  group: omniintel-hosted-cloud-worker
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine and public-caption adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "yt-dlp>=2025.1.15"
      - name: Verify hosted worker entry point
        run: omniintel-cloud-worker --help

  process-one-job:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIINTEL_WORKER_API: https://omniintel-api.scrbaba502.workers.dev
      OMNIINTEL_API_TOKEN: ${{ secrets.OMNIINTEL_API_TOKEN }}
      OMNIINTEL_DATABASE: ${{ runner.temp }}/omniintel/worker.sqlite3
      OMNIINTEL_UPLOAD_DIR: ${{ runner.temp }}/omniintel/uploads
      OMNIINTEL_ASSET_DIR: ${{ runner.temp }}/omniintel/assets
    steps:
      - name: Check whether the API secret is configured
        id: guard
        env:
          API_TOKEN: ${{ secrets.OMNIINTEL_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set the OMNIINTEL_API_TOKEN repository secret to enable hosted processing."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install the engine and YouTube caption adapter
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "yt-dlp>=2025.1.15"
      - name: Process at most one queued job
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/omniintel/uploads" "$RUNNER_TEMP/omniintel/assets"
          omniintel-cloud-worker --once
