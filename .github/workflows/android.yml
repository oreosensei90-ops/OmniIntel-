name: Android reader build
concurrency:
  group: android-reader-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, build/omniintel-foundation, migration/omniintel-foundation]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: |
          cd apps/android
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify APK and permissions
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/omniintel-apk-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/omniintel-apk-permissions.txt
          if grep -q 'android.permission.ACCESS_NETWORK_STATE' /tmp/omniintel-apk-permissions.txt; then
            echo "OmniIntel does not need broad network-state access"
            exit 1
          fi
      - name: Create APK checksum
        run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload verified debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniIntel-Android-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Report verified APK
        run: ls -lh apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="omniintel-android-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            apps/android/app/build/outputs/apk/debug/app-debug.apk \
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OmniIntel Android $GITHUB_SHA" \
            --notes "Verified debug APK for commit $GITHUB_SHA." \
            --prerelease
