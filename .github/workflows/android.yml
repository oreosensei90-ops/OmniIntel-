name: Android reader build

on:
  push:
    branches: [main, build/omniintel-foundation]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle -p apps/android assembleDebug --no-daemon --stacktrace
      - name: Verify APK and permissions
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/android/app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE'; then
            echo "Offline reader must not request network permissions"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OmniIntel-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
