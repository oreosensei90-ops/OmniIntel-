name: Android reader build
concurrency:
  group: android-reader-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, build/omniintel-foundation, migration/omniintel-foundation]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: |
          cd apps/android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK and permissions
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/android/app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE'; then
            echo "Offline reader must not request network permissions"
            exit 1
          fi
      - name: Create APK checksum
        run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniIntel-Android-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Report verified APK
        run: ls -lh apps/android/app/build/outputs/apk/debug/app-debug.apk
