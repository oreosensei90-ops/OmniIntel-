name: Deploy OmniIntel Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: Exact deployed OmniIntel Web origin (for example https://omniintel.pages.dev)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omniintel-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OMNIINTEL_API_TOKEN: ${{ secrets.OMNIINTEL_API_TOKEN }}
      OMNIINTEL_WORKER_TOKEN: ${{ secrets.OMNIINTEL_WORKER_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1fbcf581a50766853d9be8dc4444ff7f"
      WEB_ORIGIN: ${{ inputs.web_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment configuration
        run: |
          node --input-type=module -e '
            const u = new URL(process.env.WEB_ORIGIN);
            if (u.protocol !== "https:" || u.origin !== process.env.WEB_ORIGIN || u.pathname !== "/" || u.search || u.hash) {
              throw new Error("web_origin must be an exact HTTPS origin, without a path, query or fragment");
            }
            if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error("CLOUDFLARE_API_TOKEN GitHub secret is missing");
            if (!process.env.OMNIINTEL_API_TOKEN) throw new Error("OMNIINTEL_API_TOKEN GitHub secret is missing");
            if (!process.env.OMNIINTEL_WORKER_TOKEN) throw new Error("OMNIINTEL_WORKER_TOKEN GitHub secret is missing");
          '
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply omniintel-db --remote
      - name: Deploy Worker with separate API and worker tokens
        run: |
          set -euo pipefail
          test -n "$OMNIINTEL_API_TOKEN"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node -e '
            require("node:fs").writeFileSync(
              process.argv[1],
              JSON.stringify({ OMNIINTEL_API_TOKEN: process.env.OMNIINTEL_API_TOKEN, OMNIINTEL_WORKER_TOKEN: process.env.OMNIINTEL_WORKER_TOKEN }),
              { mode: 0o600 }
            );
          ' "$secret_file"
          npx wrangler deploy --var "CORS_ORIGIN:${WEB_ORIGIN}" --secrets-file "$secret_file"
