name: Python foundation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "build/**", "migration/omniintel-foundation"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,publishing,documents,service]'
      - run: pytest -q
      - run: ruff check engine tests
      - name: Check Web Reader JavaScript syntax
        run: node --check apps/web/app.js && node --check apps/web/service-worker.js
