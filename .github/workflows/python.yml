name: Python foundation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "build/**", "migration/omniintel-foundation"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,publishing,documents,service]'
      - run: pytest -q
      - run: ruff check engine tests
      - name: Check Web Reader JavaScript syntax
        run: node --check apps/web/app.js && node --check apps/web/service-worker.js

      - name: Check deployment entrypoint shell syntax
        run: bash -n deploy/start-service.sh


  hosted-worker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIINTEL_WORKER_API: https://omniintel-api.scrbaba502.workers.dev
      OMNIINTEL_API_TOKEN: ${{ secrets.OMNIINTEL_API_TOKEN }}
      OMNIINTEL_DATABASE: ${{ runner.temp }}/omniintel/worker.sqlite3
      OMNIINTEL_UPLOAD_DIR: ${{ runner.temp }}/omniintel/uploads
      OMNIINTEL_ASSET_DIR: ${{ runner.temp }}/omniintel/assets
    steps:
      - name: Check whether the API secret is configured
        id: guard
        env:
          API_TOKEN: ${{ secrets.OMNIINTEL_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set the OMNIINTEL_API_TOKEN repository secret to enable hosted processing."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install engine and YouTube adapter
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "yt-dlp>=2025.1.15"
      - name: Process one job
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/omniintel/uploads" "$RUNNER_TEMP/omniintel/assets"
          omniintel-cloud-worker --once
