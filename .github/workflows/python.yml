name: Python foundation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "build/**", "migration/omniintel-foundation", "fix/**", "research/**", "milestone/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,publishing,documents,service]'
      - run: pytest -q
      - name: Run offline end-to-end bridge and engine harness
        run: python scripts/e2e_local_bridge.py
      - run: ruff check engine tests
      - name: Check Web Reader JavaScript syntax
        run: node --check apps/web/app.js && node --check apps/web/service-worker.js
      - name: Check Cloudflare Worker tests and types
        working-directory: infra/cloudflare/worker
        run: npm install --no-audit --no-fund && npm test && npm run typecheck
      - name: Check deployment entrypoint shell syntax
        run: bash -n deploy/start-service.sh && sh -n deploy/start-cloud-worker.sh
      - name: Validate Cloud worker Compose configuration
        run: |
          cp deploy/cloud-worker.env.example deploy/cloud-worker.env
          docker compose --file deploy/cloud-worker.compose.yml config --quiet
      - name: Build production Cloudflare bridge worker image
        run: docker build --pull --file Dockerfile.cloud-worker --tag omniintel-cloud-worker:ci .
      - name: Smoke-test worker entrypoint and argument forwarding
        env:
          OMNIINTEL_WORKER_API: https://example.invalid
          OMNIINTEL_WORKER_TOKEN: ci-smoke-test-token
        run: docker run --rm -e OMNIINTEL_WORKER_API -e OMNIINTEL_WORKER_TOKEN omniintel-cloud-worker:ci --help
