name: Deploy OmniIntel Cloudflare Pages

on:
  push:
    branches:
      - milestone/end-to-end-reliability-2026-11-21
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniintel-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web app to production Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          ref: milestone/end-to-end-reliability-2026-11-21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Wrangler from Worker lockfile
        working-directory: infra/cloudflare/worker
        run: npm ci --no-audit --no-fund

      - name: Deploy production Pages site
        working-directory: infra/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler pages deploy ../../../apps/web --project-name=omniintel --branch=main
