name: OmniIntel hosted processing worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: omniintel-hosted-worker-dispatch
  cancel-in-progress: false

jobs:
  dispatch-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the implementation-branch processor
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "hosted-worker.yml";
            const ref = "milestone/end-to-end-reliability-2026-11-21";
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref
            });
            core.notice("Dispatched the OmniIntel processor on " + ref);
