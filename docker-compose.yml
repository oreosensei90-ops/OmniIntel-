services:
  omniintel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${OMNIINTEL_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      OMNIINTEL_API_HOST: "0.0.0.0"
      OMNIINTEL_DATABASE: /var/lib/omniintel/omniintel.db
      OMNIINTEL_ASSET_DIR: /var/lib/omniintel/assets
      OMNIINTEL_UPLOAD_DIR: /var/lib/omniintel/uploads
      OMNIINTEL_API_TOKEN: ${OMNIINTEL_API_TOKEN:?Set a long random API token in .env}
      OMNIINTEL_OPENAI_API_KEY: ${OMNIINTEL_OPENAI_API_KEY:?Set the server-side AI API key in .env}
      OMNIINTEL_OPENAI_MODEL: ${OMNIINTEL_OPENAI_MODEL:-gpt-4.1-mini}
      OMNIINTEL_CORS_ORIGINS: ${OMNIINTEL_CORS_ORIGINS:?Set the exact Web app origin in .env}
      OMNIINTEL_ASR_MODEL_PATH: /models/faster-whisper-small
      OMNIINTEL_ASR_DEVICE: ${OMNIINTEL_ASR_DEVICE:-cpu}
      OMNIINTEL_ASR_COMPUTE_TYPE: ${OMNIINTEL_ASR_COMPUTE_TYPE:-int8}
      OMNIINTEL_ASR_THREADS: ${OMNIINTEL_ASR_THREADS:-4}
    volumes:
      - omniintel-data:/var/lib/omniintel
      - ${OMNIINTEL_ASR_MODEL_HOST_PATH:-./models/faster-whisper-small}:/models/faster-whisper-small:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  omniintel-data:
