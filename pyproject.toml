[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniintel-engine"
version = "0.1.0"
description = "Local-first source-to-knowledge engine for OmniIntel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jsonschema>=4.22"]
publishing = ["reportlab>=4.2", "python-docx>=1.1"]
documents = ["pypdf>=5.0", "pdfplumber>=0.11", "pypdfium2>=4.30"]
asr = ["faster-whisper>=1.1"]
vision = ["Pillow>=10.0"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
youtube = ["yt-dlp>=2025.1.15"]

[project.scripts]
omniintel = "omniintel.cli:main"
omniintel-youtube = "omniintel.youtube_pipeline:main"
omniintel-youtube-queue = "omniintel.youtube_pipeline:queue_main"
omniintel-compose-source = "omniintel.youtube_pipeline:compose_source_main"
omniintel-study-guide = "omniintel.study_generation:main"
omniintel-api = "omniintel.api:main"
omniintel-worker = "omniintel.worker:main"
omniintel-textbook-review = "omniintel.textbook_review:main"

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["omniintel"]
