[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniintel-engine"
version = "0.1.0"
description = "Local-first source-to-knowledge engine for OmniIntel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jsonschema>=4.22"]
publishing = ["reportlab>=4.2", "python-docx>=1.1"]

[project.scripts]
omniintel = "omniintel.cli:main"

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["omniintel"]
